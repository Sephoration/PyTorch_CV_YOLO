model: yolo11n.pt
epochs: 50
batch: 8
imgsz: 640
patience: 10
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: true
save: true
save_period: 1
cache: true
device: cpu
data: yolo_dataset\cell_dataset.yaml
cls: 1.0
early_stopping:
  enable: true
  monitor: val/box_loss
  min_delta: 0.0001
  patience: 10
